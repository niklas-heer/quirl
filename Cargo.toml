[workspace]
members = [
    "crates/quirl-bench",
    "crates/quirl-catalog",
    "crates/quirl-cli",
    "crates/quirl-core",
    "crates/quirl-lua",
    "crates/quirl-steel",
    "crates/quirl-syntax",
    "crates/quirl-ui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/niklas-heer/quirl"
rust-version = "1.88"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
mlua = { version = "0.12", features = ["lua54", "vendored", "serialize"] }
nu-ansi-term = "0.50"
reedline = "0.49"
rhai = "1.25.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1.3"
steel-core = "0.8.2"
thiserror = "2"

[profile.release]
lto = "thin"
strip = "symbols"
