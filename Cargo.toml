[workspace]
members = [
    "crates/quirl-bench",
    "crates/quirl-catalog",
    "crates/quirl-cli",
    "crates/quirl-contract",
    "crates/quirl-core",
    "crates/quirl-data",
    "crates/quirl-lua",
    "crates/quirl-lsp",
    "crates/quirl-picker",
    "crates/quirl-plugin",
    "crates/quirl-process",
    "crates/quirl-syntax",
    "crates/quirl-ui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/niklas-heer/quirl"
rust-version = "1.88"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
getrandom = "0.3"
mlua = { version = "0.12", features = ["lua54", "vendored", "serialize", "send"] }
nu-ansi-term = "0.50"
nix = { version = "0.30", features = ["process", "signal", "term"] }
os_pipe = "1.2"
reedline = "0.49"
rhai = "1.25.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
shlex = "1.3"
signal-hook = "0.3"
toml = "0.9"
unicode-segmentation = "1.13.3"
wasmparser = { version = "0.256", default-features = false, features = ["std", "validate", "component-model"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
opt-level = "z"
lto = "fat"
strip = "symbols"
# mlua converts host-callback panics into Lua errors via unwinding. abort
# would terminate the shell instead of producing a ShellError.
panic = "unwind"
codegen-units = 1
