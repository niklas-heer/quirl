[workspace]
members = [
    "crates/quirl-bench",
    "crates/quirl-catalog",
    "crates/quirl-cli",
    "crates/quirl-contract",
    "crates/quirl-core",
    "crates/quirl-data",
    "crates/quirl-lua",
    "crates/quirl-lsp",
    "crates/quirl-picker",
    "crates/quirl-plugin",
    "crates/quirl-process",
    "crates/quirl-syntax",
    "crates/quirl-ui",
    "xtask",
]
default-members = ["crates/quirl-cli"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/niklas-heer/quirl"
rust-version = "1.97.1"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
# Rich reports are limited to the developer-only xtask binary. Product errors
# continue to use the serialized quirl_core::ShellError contract.
color-eyre = { version = "=0.6.5", default-features = false, features = ["track-caller"] }
# The Unix MIO backend can discard readable keyboard readiness when it returns
# SIGWINCH from the same edge-triggered poll batch, stranding queued input.
# Use the existing level-triggered backend so unread bytes remain observable.
# It retains the same parser, 1 KiB read buffer, raw-mode owner, and polling;
# filedescriptor is already present through the terminal dependency graph.
crossterm = { version = "0.29", features = ["use-dev-tty"] }
getrandom = "0.3"
# Explorer image previews admit only four common raster formats and disable
# encoders, parallelism, and high-cost formats such as AVIF, EXR, and TIFF.
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
indexmap = { version = "2.14", features = ["serde"] }
# Source spans support inert diagnostics; legacy-v1 and fallback parsing stay disabled.
kdl = { version = "6.5", default-features = false, features = ["span"] }
mlua = { version = "0.12", features = ["lua55", "vendored", "serialize", "send"] }
nu-ansi-term = "0.50"
nix = { version = "0.30", features = ["process", "signal", "term"] }
os_pipe = "1.2"
reedline = "0.49"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "scrolling-regions"] }
rusqlite = { version = "0.40.1", features = ["bundled", "limits", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
signal-hook = "0.3"
model2vec-rs = { version = "0.2.1", default-features = false, features = ["local-only", "onig"] }
# Bundled syntax dumps avoid runtime discovery. Semantic scopes are mapped to
# Quirl's active theme; the existing Oniguruma engine is reused by the CLI.
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "regex-onig"] }
toml = "0.9"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
ureq = { version = "=3.3.0", default-features = false, features = ["rustls"] }
wasmparser = { version = "0.256", default-features = false, features = ["std", "validate", "component-model"] }
xshell = "0.2.7"

[patch.crates-io]
# Bounded embedded terminal: preserve wide-cell and scrollback invariants on resize.
vt100 = { path = "vendor/vt100" }
# mlua-sys 0.11.0 caps lua-src below 551 even though its Lua 5.5 bindings are
# compatible. Keep this source-identical patch until upstream accepts
# lua-src 551.x, then remove the patch and vendor/mlua-sys together.
mlua-sys = { path = "vendor/mlua-sys" }
# ADR 0032: bound Unix terminal input before events reach the editor.
crossterm = { path = "vendor/crossterm" }
# Bound simple-editor input/undo and escape source controls at rendering.
reedline = { path = "vendor/reedline" }
# Read tokenizer unknown-token metadata directly without serializing its full graph.
model2vec-rs = { path = "vendor/model2vec-rs" }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

# These high-volume categories describe established API, documentation, and
# control-flow debt. Keeping the allowlist explicit lets every other pedantic
# and nursery lint gate new code while each category is retired deliberately.
assigning_clones = "allow"
bool_to_int_with_if = "allow"
case_sensitive_file_extension_comparisons = "allow"
default_trait_access = "allow"
derive_partial_eq_without_eq = "allow"
doc_markdown = "allow"
duration_suboptimal_units = "allow"
elidable_lifetime_names = "allow"
format_collect = "allow"
format_push_string = "allow"
if_not_else = "allow"
items_after_statements = "allow"
manual_is_variant_and = "allow"
manual_let_else = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_continue = "allow"
needless_pass_by_ref_mut = "allow"
needless_pass_by_value = "allow"
needless_raw_string_hashes = "allow"
option_if_let_else = "allow"
or_fun_call = "allow"
redundant_clone = "allow"
redundant_closure_for_method_calls = "allow"
redundant_pub_crate = "allow"
return_self_not_must_use = "allow"
semicolon_if_nothing_returned = "allow"
significant_drop_tightening = "allow"
similar_names = "allow"
single_match_else = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
too_long_first_doc_paragraph = "allow"
too_many_lines = "allow"
trivially_copy_pass_by_ref = "allow"
uninlined_format_args = "allow"
unnecessary_semicolon = "allow"
unnecessary_wraps = "allow"
unnested_or_patterns = "allow"
unreadable_literal = "allow"
unused_self = "allow"
use_self = "allow"
useless_let_if_seq = "allow"
wildcard_imports = "allow"

as_conversions = "deny"
arithmetic_side_effects = "deny"
expect_used = "deny"
exit = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
todo = "deny"
unchecked_time_subtraction = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
dead_code_pub_in_binary = "deny"
missing_docs = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "deny"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.release]
opt-level = "z"
lto = "fat"
strip = "symbols"
# mlua catches host-callback panics at its Lua boundary and resumes them in
# Rust. Retain unwinding so Rust cleanup and panic propagation can complete.
panic = "unwind"
codegen-units = 1
