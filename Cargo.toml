[workspace]
members = [
    "crates/quirl-bench",
    "crates/quirl-catalog",
    "crates/quirl-cli",
    "crates/quirl-contract",
    "crates/quirl-core",
    "crates/quirl-data",
    "crates/quirl-lua",
    "crates/quirl-lsp",
    "crates/quirl-picker",
    "crates/quirl-plugin",
    "crates/quirl-process",
    "crates/quirl-syntax",
    "crates/quirl-ui",
    "xtask",
]
default-members = ["crates/quirl-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/niklas-heer/quirl"
rust-version = "1.97.1"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
getrandom = "0.3"
mlua = { version = "0.12", features = ["lua54", "vendored", "serialize", "send"] }
nu-ansi-term = "0.50"
nix = { version = "0.30", features = ["process", "signal", "term"] }
os_pipe = "1.2"
reedline = "0.49"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "scrolling-regions"] }
rusqlite = { version = "0.40.1", features = ["bundled", "limits", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
signal-hook = "0.3"
model2vec-rs = { version = "0.2.1", default-features = false, features = ["local-only", "onig"] }
toml = "0.9"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
ureq = { version = "=3.3.0", default-features = false, features = ["rustls"] }
wasmparser = { version = "0.256", default-features = false, features = ["std", "validate", "component-model"] }
xshell = "0.2.7"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "deny"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.release]
opt-level = "z"
lto = "fat"
strip = "symbols"
# mlua converts host-callback panics into Lua errors via unwinding. abort
# would terminate the shell instead of producing a ShellError.
panic = "unwind"
codegen-units = 1
