[package]
name = "quirl-typescript-quickjs-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[dependencies]
rquickjs = "0.12.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = "symbols"

[workspace]
resolver = "3"
