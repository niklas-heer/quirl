[package]
name = "quirl-footprint-spike"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[features]
default = []
lua = ["dep:mlua", "mlua/lua54", "mlua/vendored"]
luau = ["dep:mlua", "mlua/luau", "mlua/vendored"]
fennel = ["dep:mlua", "mlua/lua54", "mlua/vendored"]
rhai = ["dep:rhai"]
quickjs = ["dep:rquickjs"]
steel = ["dep:steel-core"]
gluon = ["dep:gluon"]

[dependencies]
gluon = { version = "0.18.4", optional = true }
mlua = { version = "0.12.0", default-features = false, optional = true }
rhai = { version = "1.25.1", optional = true }
rquickjs = { version = "0.12.2", optional = true }
steel-core = { version = "0.8.2", optional = true }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
panic = "abort"
strip = "symbols"

# Each engine is built separately so Cargo never unifies incompatible VM features.
[workspace]
