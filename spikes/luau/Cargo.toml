[package]
name = "quirl-luau-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[dependencies]
mlua = { version = "0.12.0", features = ["luau", "vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = "symbols"

# Keep Luau's mutually exclusive mlua engine feature out of Quirl's Lua workspace.
[workspace]
resolver = "3"
