[package]
name = "quirl-core"
description = "Passive process contracts, structured values, and errors for Quirl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
# Formatting must open an attacker-replaceable source without following links
# or blocking on a concurrently substituted FIFO. The standard library cannot
# express those open flags portably; nix is already pinned by the workspace.
nix = { workspace = true, features = ["fs"] }
