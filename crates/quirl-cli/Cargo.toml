[package]
name = "quirl-cli"
description = "The Quirl shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "quirl"
path = "src/main.rs"

[dependencies]
clap.workspace = true
getrandom.workspace = true
indexmap.workspace = true
quirl-catalog = { path = "../quirl-catalog" }
quirl-contract = { path = "../quirl-contract" }
quirl-core = { path = "../quirl-core" }
quirl-data = { path = "../quirl-data" }
quirl-lua = { path = "../quirl-lua" }
quirl-lsp = { path = "../quirl-lsp" }
quirl-picker = { path = "../quirl-picker" }
quirl-plugin = { path = "../quirl-plugin" }
quirl-process = { path = "../quirl-process" }
quirl-syntax = { path = "../quirl-syntax" }
quirl-ui = { path = "../quirl-ui" }
reedline.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
signal-hook.workspace = true
model2vec-rs.workspace = true
unicode-width.workspace = true
ureq.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs"] }
