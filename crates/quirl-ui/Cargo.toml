[package]
name = "quirl-ui"
description = "Quirl's semantic prompt, completion menu, and diagnostics"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
crossterm.workspace = true
image.workspace = true
nu-ansi-term.workspace = true
quirl-catalog = { path = "../quirl-catalog" }
quirl-core = { path = "../quirl-core" }
quirl-lua = { path = "../quirl-lua" }
quirl-syntax = { path = "../quirl-syntax" }
ratatui.workspace = true
reedline = { workspace = true, features = ["helix"] }
serde.workspace = true
serde_json.workspace = true
syntect.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
# The child-terminal admission gate bounds controls before this screen parser.
vt100 = { version = "=0.15.2", default-features = false }

[target.'cfg(unix)'.dependencies]
# Reuse workspace platform constants for nonblocking regular-file admission;
# opening first with std::fs::File can hang on a substituted FIFO.
nix.workspace = true
