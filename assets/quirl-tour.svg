#l35" y="396"/><use href="#l36" y="418"/><use href="#l37" y="462"/><use href="#l38" y="484"/><use href="#l39" y="506"/><use href="#l40" y="550"/><use href="#l41" y="572"/></g><g transform="translate(20000 0)"><use href="#c" x="0" y="594"/><use href="#l24" y="0"/><use href="#l25" y="22"/><use href="#l26" y="44"/><use href="#l27" y="88"/><use href="#l28" y="110"/><use href="#l29" y="154"/><use href="#l30" y="198"/><use href="#l31" y="220"/><use href="#l32" y="242"/><use href="#l33" y="286"/><use href="#l34" y="330"/><use href="#l35" y="352"/><use href="#l36" y="374"/><use href="#l37" y="418"/><use href="#l38" y="440"/><use href="#l39" y="462"/><use href="#l40" y="506"/><use href="#l41" y="528"/><g transform="translate(0 572)"><text y="16">OK Tour complete. Run quirl for the full interactive shell.</text></g></g></g></g></svg></svg>