<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="616" viewBox="0 0 1000 616"><rect width="1000" height="616" rx="0" fill="#171b21"/><svg x="0" y="0" width="1000" height="616" viewBox="0 0 1000 616" overflow="hidden"><style>@keyframes a{0%{transform:translateX(-0px)}7.638849%{transform:translateX(-1000px)}7.790753%{transform:translateX(-2000px)}15.38593%{transform:translateX(-3000px)}22.981107%{transform:translateX(-4000px)}23.076047%{transform:translateX(-5000px)}30.671224%{transform:translateX(-6000px)}38.266401%{transform:translateX(-7000px)}38.338555%{transform:translateX(-8000px)}45.933732%{transform:translateX(-9000px)}53.528909%{transform:translateX(-10000px)}54.102345%{transform:translateX(-11000px)}61.697522%{transform:translateX(-12000px)}69.292699%{transform:translateX(-13000px)}69.427514%{transform:translateX(-14000px)}77.022691%{transform:translateX(-15000px)}77.119529%{transform:translateX(-16000px)}84.714706%{transform:translateX(-17000px)}92.309883%{transform:translateX(-18000px)}92.402924%{transform:translateX(-19000px)}99.998101%{transform:translateX(-20000px)}100%{transform:translateX(-20000px)}}.r{animation:a 52.665s steps(1,end) infinite}text{white-space:pre;font-kerning:none;font-variant-ligatures:none;font-synthesis:none;font-optical-sizing:none;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;text-decoration-skip-ink:none;text-decoration-thickness:1px;text-underline-offset:2px;letter-spacing:0.4px}</style><g font-family="&apos;JetBrains Mono&apos;,&apos;Fira Code&apos;,&apos;SF Mono&apos;,Menlo,Consolas,&apos;DejaVu Sans Mono&apos;,&apos;Liberation Mono&apos;,&apos;Symbols Nerd Font Mono&apos;,&apos;Symbols Nerd Font&apos;,&apos;Powerline Symbols&apos;,&apos;Apple Symbols&apos;,&apos;Segoe UI Symbol&apos;,&apos;Noto Sans Symbols 2&apos;,&apos;Noto Sans Symbols&apos;,&apos;Apple Color Emoji&apos;,&apos;Segoe UI Emoji&apos;,&apos;Noto Color Emoji&apos;,monospace" font-size="16" fill="#eceff4" shape-rendering="crispEdges"><defs><g id="c"><rect width="10" height="22" fill="#6a737d"/></g><g id="l0"><text y="16">Quirl - a well-stirred shell</text></g><g id="l1"><text y="16">The three prompt modes make bytes, typed values, and intent visibly different.</text></g><g id="l2"><text y="16">NORMAL MODE — run familiar programs; Quirl owns pipes and process status.</text></g><g id="l3"><text y="16">&gt; exec printf 'api ready\nworker degraded\n' | grep degraded &amp;&amp; printf 'pipeline status: healthy\n'</text></g><g id="l4"><text y="16">worker degraded</text></g><g id="l5"><text y="16">pipeline status: healthy</text></g><g id="l6"><text y="16">COMPLETION — learn flags from the same catalog that powers help and docs.</text></g><g id="l7"><text y="16">&gt; complete git commit --am</text></g><g id="l8"><text y="16">--amend                      Replace the tip of the current branch</text></g><g id="l9"><text y="16">DATA MODE — filter and sort real typed fields before rendering a table.</text></g><g id="l10"><text y="16">&gt; data [{"service":"api","region":"eu","latency_ms":18},{"service":"worker","region":"us","latency_m</text></g><g id="l11"><text y="16">s":91},{"service":"jobs","region":"eu","latency_ms":54}] | where latency_ms &gt; 50 | sort latency_ms d</text></g><g id="l12"><text y="16">esc | select service region latency_ms</text></g><g id="l13"><text y="16">service region  latency_ms</text></g><g id="l14"><text y="16">worker  us      91</text></g><g id="l15"><text y="16">jobs    eu      54</text></g><g id="l16"><text y="16">AI MODE — describe the goal; local results are suggested, never auto-executed.</text></g><g id="l17"><text y="16">&gt; ai search show git branch status --limit 3</text></g><g id="l18"><text y="16">git status                            0.033  hybrid · command</text></g><g id="l19"><text y="16">git status --short -s                 0.032  hybrid · option</text></g><g id="l20"><text y="16">git commit --amend                    0.032  hybrid · option</text></g><g id="l21"><text y="16">LUA SDK — bounded extension logic for scripts and config, not a hidden mode.</text></g><g id="l22"><text y="16">&gt; eval return { answer = 6 * 7, runtime = "sandboxed Lua 5.4" }</text></g><g id="l23"><text y="16">{</text></g><g id="l24"><text x="20" y="16">"answer": 42,</text></g><g id="l25"><text x="20" y="16">"runtime": "sandboxed Lua 5.4"</text></g><g id="l26"><text y="16">}</text></g><g id="l27"><text y="16">&gt; check hello.lua</text></g><g id="l28"><text y="16">✓ hello.lua is valid</text></g><g id="l29"><text y="16">ONE CATALOG — the interactive UI, CLI, docs, and agents share one contract.</text></g><g id="l30"><text y="16">&gt; describe quirl complete</text></g><g id="l31"><text y="16">quirl complete &lt;input&gt; [--format text|json]</text></g><g id="l32"><text x="20" y="16">Query the semantic completion engine</text></g><g id="l33"><text y="16">Returns the same attributed completion items used by the interactive editor.</text></g><g id="l34"><text y="16">Input: Nothing</text></g><g id="l35"><text y="16">Output: Bytes</text></g><g id="l36"><text y="16">Live streaming: false</text></g><g id="l37"><text y="16">Options:</text></g><g id="l38"><text x="20" y="16">input                    Positional `input` declared by the builtin command signature.</text></g><g id="l39"><text x="20" y="16">--format                 Choose stable text or JSON output</text></g><g id="l40"><text y="16">Examples:</text></g><g id="l41"><text x="20" y="16">quirl complete 'git commit --am' --format json</text></g></defs><g class="r"><g transform="translate(0 0)"><use href="#c" x="0" y="88"/><use href="#l0" y="0"/><use href="#l1" y="22"/><use href="#l2" y="66"/></g><g transform="translate(1000 0)"><use href="#c" x="0" y="132"/><use href="#l0" y="0"/><use href="#l1" y="22"/><use href="#l2" y="66"/><use href="#l3" y="110"/></g><g transform="translate(2000 0)"><use href="#c" x="0" y="198"/><use href="#l0" y="0"/><use href="#l1" y="22"/><use href="#l2" y="66"/><use href="#l3" y="110"/><use href="#l4" y="132"/><use href="#l5" y="154"/></g><g transform="translate(3000 0)"><use href="#c" x="0" y="242"/><use href="#l0" y="0"/><use href="#l1" y="22"/><use href="#l2" y="66"/><use href="#l3" y="110"/><use href="#l4" y="132"/><use href="#l5" y="154"/><use href="#l6" y="220"/></g><g transform="translate(4000 0)"><use href="#c" x="0" y="286"/><use href="#l0" y="0"/><use href="#l1" y="22"/><use href="#l2" y="66"/><use href="#l3" y="110"/><use href="#l4" y="132"/><use href="#l5" y="154"/><use href="#l6" y="220"/><use href="#l7" y="264"/></g><g transform="translate(5000 0)"><use href="#c" x="0" y="308"/><use href="#l0" y="0"/><use href="#l1" y="22"/><use href="#l2" y="66"/><use href="#l3" y="110"/><use href="#l4" y="132"/><use href="#l5" y="154"/><use href="#l6" y="220"/><use href="#l7" y="264"/><use href="#l8" y="286"/></g><g transform="translate(6000 0)"><use href="#c" x="0" y="352"/><use href="#l0" y="0"/><use href="#l1" y="22"/><use href="#l2" y="66"/><use href="#l3" y="110"/><use href="#l4" y="132"/><use href="#l5" y="154"/><use href="#l6" y="220"/><use href="#l7" y="264"/><use href="#l8" y="286"/><use href="#l9" y="330"/></g><g transform="translate(7000 0)"><use href="#c" x="0" y="440"/><use href="#l0" y="0"/><use href="#l1" y="22"/><use href="#l2" y="66"/><use href="#l3" y="110"/><use href="#l4" y="132"/><use href="#l5" y="154"/><use href="#l6" y="220"/><use href="#l7" y="264"/><use href="#l8" y="286"/><use href="#l9" y="330"/><use href="#l10" y="374"/><use href="#l11" y="396"/><use href="#l12" y="418"/></g><g transform="translate(8000 0)"><use href="#c" x="0" y="506"/><use href="#l0" y="0"/><use href="#l1" y="22"/><use href="#l2" y="66"/><use href="#l3" y="110"/><use href="#l4" y="132"/><use href="#l5" y="154"/><use href="#l6" y="220"/><use href="#l7" y="264"/><use href="#l8" y="286"/><use href="#l9" y="330"/><use href="#l10" y="374"/><use href="#l11" y="396"/><use href="#l12" y="418"/><use href="#l13" y="440"/><use href="#l14" y="46