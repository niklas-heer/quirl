<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="616" viewBox="0 0 1000 616"><rect width="1000" height="616" rx="0" fill="#171b21"/><svg x="0" y="0" width="1000" height="616" viewBox="0 0 1000 616" overflow="hidden"><style>@keyframes a{0%{transform:translateX(-0px)}2.076738%{transform:translateX(-1000px)}2.557933%{transform:translateX(-2000px)}21.552488%{transform:translateX(-3000px)}22.198303%{transform:translateX(-4000px)}41.192858%{transform:translateX(-5000px)}41.750032%{transform:translateX(-6000px)}60.744587%{transform:translateX(-7000px)}61.441054%{transform:translateX(-8000px)}80.435608%{transform:translateX(-9000px)}81.005445%{transform:translateX(-10000px)}100%{transform:translateX(-11000px)}}.r{animation:a 7.897s steps(1,end) infinite}.s0{fill:#1f6feb;font-weight:700}.s1{fill:#a2fca2;font-weight:700}.s2{fill:#c4a0f5;font-weight:700}text{white-space:pre;font-kerning:none;font-variant-ligatures:none;font-synthesis:none;font-optical-sizing:none;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;text-decoration-skip-ink:none;text-decoration-thickness:1px;text-underline-offset:2px;letter-spacing:0.4px}</style><g font-family="&apos;JetBrains Mono&apos;,&apos;Fira Code&apos;,&apos;SF Mono&apos;,Menlo,Consolas,&apos;DejaVu Sans Mono&apos;,&apos;Liberation Mono&apos;,&apos;Symbols Nerd Font Mono&apos;,&apos;Symbols Nerd Font&apos;,&apos;Powerline Symbols&apos;,&apos;Apple Symbols&apos;,&apos;Segoe UI Symbol&apos;,&apos;Noto Sans Symbols 2&apos;,&apos;Noto Sans Symbols&apos;,&apos;Apple Color Emoji&apos;,&apos;Segoe UI Emoji&apos;,&apos;Noto Color Emoji&apos;,monospace" font-size="16" fill="#eceff4" shape-rendering="crispEdges"><defs><g id="c"><rect width="10" height="22" fill="#6a737d"/></g><g id="l0"><text y="16" class="s2">Quirl - a well-stirred shell</text></g><g id="l1"><text y="16">One binary for familiar commands, typed data, and a sandboxed Lua SDK.</text></g><g id="l2"><text y="16" class="s0">&gt; data [{"service":"api","status":"up","latency_ms":18},{"service":"worker","status":"degraded","lat</text></g><g id="l3"><text y="16" class="s0">ency_ms":91}] | where status == "degraded" | select service status latency_ms</text></g><g id="l4"><text y="16">service status  latency_ms</text></g><g id="l5"><text y="16">worker  degraded        91</text></g><g id="l6"><text y="16" class="s0">&gt; complete git commit --am</text></g><g id="l7"><text y="16">--amend                      Replace the tip of the current branch</text></g><g id="l8"><text y="16" class="s0">&gt; eval return { answer = 6 * 7, runtime = "sandboxed Lua 5.4" }</text></g><g id="l9"><text y="16">{</text></g><g id="l10"><text x="20" y="16">"answer": 42,</text></g><g id="l11"><text x="20" y="16">"runtime": "sandboxed Lua 5.4"</text></g><g id="l12"><text y="16">}</text></g><g id="l13"><text y="16" class="s0">&gt; check hello.lua</text></g><g id="l14"><text y="16">✓ hello.lua is valid</text></g><g id="l15"><text y="16">## Options</text></g><g id="l16"><text y="16">- `arguments` — Positional `arguments` declared by the builtin command signature.</text></g><g id="l17"><text y="16">- `file|-` — Positional `file|-` declared by the builtin command signature.</text></g><g id="l18"><text y="16">- `--lang` — Select the language explicitly, including for stdin</text></g><g id="l19"><text y="16">## Examples</text></g><g id="l20"><text y="16">```sh</text></g><g id="l21"><text y="16">quirl run scripts/deploy.lua -- staging</text></g><g id="l22"><text y="16">```</text></g><g id="l23"><text y="16">quirl run --lang lua -</text></g><g id="l24"><text y="16">quirl run --lang bash legacy.sh</text></g><g id="l25"><text y="16">quirl run --lang zsh release.zsh</text></g></defs><g class="r"><g transform="translate(0 0)"><use href="#c" x="0" y="0"/></g><g transform="translate(1000 0)"><use href="#c" x="0" y="110"/><use href="#l0" y="0"/><use href="#l1" y="22"/><use href="#l2" y="66"/><use href="#l3" y="88"/></g><g transform="translate(2000 0)"><use href="#c" x