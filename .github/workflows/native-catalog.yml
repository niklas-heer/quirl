name: Native catalog

on:
  schedule:
    - cron: "41 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-catalog
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out Quirl
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check out the exact Carapace source revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: carapace-sh/carapace-bin
          ref: ebfb9beda84fdf057dc9a89b59527158d23d323c
          path: carapace-source
          fetch-depth: 1
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal

      - name: Import and validate the native catalog
        shell: bash
        run: |
          set -euo pipefail
          revision="ebfb9beda84fdf057dc9a89b59527158d23d323c"
          cargo xtask catalog import-carapace \
            --source carapace-source \
            --revision "$revision"
          cargo xtask catalog fmt --check
          cargo xtask catalog build
          cargo xtask catalog check
          (
            cd catalog/generated
            sha256sum --check catalog.sqlite3.sha256
          )
          git diff --exit-code -- catalog

      - name: Upload the compiled catalog and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-catalog-${{ github.sha }}
          path: |
            catalog/generated/catalog.sqlite3
            catalog/generated/catalog.sqlite3.sha256
            catalog/provenance
            catalog/draft/*.kdl
            catalog/draft/carapace.import.json
          if-no-files-found: error
          retention-days: 14
