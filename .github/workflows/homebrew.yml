name: Homebrew

on:
  workflow_call:
    inputs:
      tag:
        description: Existing immutable Quirl release tag to publish to the tap
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable Quirl release tag to publish to the tap
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homebrew-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  formula:
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out the exact release tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Check out the Homebrew tap
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: niklas-heer/homebrew-tap
          path: homebrew-tap
          persist-credentials: false

      - name: Prepare an isolated registered tap for auditing
        id: audit-tap
        shell: bash
        run: |
          set -euo pipefail
          audit_parent="$(brew --repository)/Library/Taps/quirl-release"
          audit_name="quirl-release/quirl-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          audit_tap="$audit_parent/homebrew-${audit_name#*/}"
          audit_config="$RUNNER_TEMP/homebrew-audit-config-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$audit_tap"
          test ! -e "$audit_config"
          mkdir -p "$audit_parent"
          mkdir -p "$audit_config"
          cp -R "$GITHUB_WORKSPACE/homebrew-tap" "$audit_tap"
          printf 'name=%s\n' "$audit_name" >> "$GITHUB_OUTPUT"
          printf 'path=%s\n' "$audit_tap" >> "$GITHUB_OUTPUT"
          printf 'config=%s\n' "$audit_config" >> "$GITHUB_OUTPUT"

      - name: Download the published release manifest
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1.13
        with:
          repository: ${{ github.repository }}
          tag: ${{ inputs.tag }}
          fileName: release-manifest-v1.json
          out-file-path: release
          token: ${{ github.token }}

      - name: Download the native package for the offline install test
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1.13
        with:
          repository: ${{ github.repository }}
          tag: ${{ inputs.tag }}
          fileName: "quirl-v*-aarch64-apple-darwin.tar"
          out-file-path: release
          token: ${{ github.token }}

      - name: Render the formula from the release manifest
        env:
          EXPECTED_TAG: ${{ inputs.tag }}
        run: >-
          cargo xtask homebrew render
          --release-manifest release/release-manifest-v1.json
          --expected-tag "$EXPECTED_TAG"
          --tap-root "${{ steps.audit-tap.outputs.path }}"
          --write

      - name: Stage the formula for changed-file auditing
        env:
          XDG_CONFIG_HOME: ${{ steps.audit-tap.outputs.config }}
        shell: bash
        run: |
          set -euo pipefail
          git -C "${{ steps.audit-tap.outputs.path }}" add -- Formula/quirl.rb
          brew trust --tap "${{ steps.audit-tap.outputs.name }}"

      - name: Verify the rendered tap
        env:
          XDG_CONFIG_HOME: ${{ steps.audit-tap.outputs.config }}
        run: >-
          cargo xtask homebrew check
          --tap-root "${{ steps.audit-tap.outputs.path }}"
          --release-manifest release/release-manifest-v1.json
          --package-root release

      - name: Preserve the verified formula
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-formula
          path: ${{ steps.audit-tap.outputs.path }}/Formula/quirl.rb
          if-no-files-found: error
          retention-days: 7

      - name: Remove the isolated audit tap
        if: always() && steps.audit-tap.outputs.path != ''
        env:
          AUDIT_CONFIG: ${{ steps.audit-tap.outputs.config }}
          AUDIT_TAP: ${{ steps.audit-tap.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          audit_prefix="$(brew --repository)/Library/Taps/quirl-release/homebrew-quirl-"
          config_prefix="$RUNNER_TEMP/homebrew-audit-config-"
          case "$AUDIT_TAP" in
            "$audit_prefix"*) ;;
            *) exit 1 ;;
          esac
          case "$AUDIT_CONFIG" in
            "$config_prefix"*) ;;
            *) exit 1 ;;
          esac
          find "$AUDIT_TAP" -depth -delete
          find "$AUDIT_CONFIG" -depth -delete

  pull-request:
    needs: formula
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: homebrew-tap
    permissions:
      contents: read

    steps:
      - name: Check out the Homebrew tap without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: niklas-heer/homebrew-tap
          path: homebrew-tap
          persist-credentials: false

      - name: Restore the verified formula
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-formula
          path: homebrew-tap/Formula

      - name: Create a narrowly scoped tap token
        id: tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: niklas-heer
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write

      - name: Open the tap pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.tap-token.outputs.token }}
          path: homebrew-tap
          add-paths: Formula/quirl.rb
          branch: codex/quirl-${{ inputs.tag }}
          delete-branch: true
          commit-message: "chore(quirl): update to ${{ inputs.tag }}"
          title: "chore(quirl): update to ${{ inputs.tag }}"
          body: Generated and checked from Quirl's immutable release manifest.
