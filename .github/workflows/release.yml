name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact SemVer tag verified by the release plan (for example, v0.1.0)
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      candidate_commit: ${{ steps.candidate.outputs.commit }}

    steps:
      - name: Check out the candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Install Linux reference shells
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh

      - name: Verify the release state
        env:
          EXPECTED_TAG: ${{ inputs.tag }}
        run: >-
          cargo xtask release verify
          --expected-tag "$EXPECTED_TAG"
          --required-remote-branch main

      - name: Freeze the verified candidate identity
        id: candidate
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run the canonical quality gate
        # Match CI's bounded concurrency for process and terminal deadlines.
        env:
          RUST_TEST_THREADS: "2"
        run: cargo xtask check

  package:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.check.outputs.candidate_commit }}

      - name: Build and package the native binary
        id: package
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: >-
          cargo xtask release package
          --target "$RELEASE_TARGET"
          --output "${{ runner.temp }}/package"

      - name: Measure the exact native release artifact
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          EVIDENCE_PATH: ${{ runner.temp }}/release-performance.json
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --target "$RELEASE_TARGET" -p quirl-bench
          binary="target/$RELEASE_TARGET/release/quirl"
          if command -v sha256sum >/dev/null 2>&1; then
            digest=$(sha256sum "$binary" | awk '{print $1}')
          else
            digest=$(shasum -a 256 "$binary" | awk '{print $1}')
          fi
          "target/$RELEASE_TARGET/release/quirl-bench" release \
            --quirl "$binary" --expected-sha256 "$digest" --json > "$EVIDENCE_PATH"

      - name: Preserve native performance evidence even on a budget failure
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-${{ matrix.target }}
          path: ${{ runner.temp }}/release-performance.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve the candidate package
        # Failed measurements must remain inspectable against their exact
        # executable. The failed job still blocks aggregation and publication.
        if: ${{ always() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.target }}
          path: ${{ runner.temp }}/package
          if-no-files-found: error
          retention-days: 1

  asset:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        kind:
          - completion-database
          - command-model
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.check.outputs.candidate_commit }}

      - name: Build the downloadable asset
        env:
          ASSET_KIND: ${{ matrix.kind }}
        run: >-
          cargo xtask assets build
          --kind "$ASSET_KIND"
          --output "${{ runner.temp }}/asset"

      - name: Preserve the downloadable asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asset-${{ matrix.kind }}
          path: ${{ runner.temp }}/asset
          if-no-files-found: error
          retention-days: 1

  asset-manifest:
    needs:
      - check
      - asset
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.check.outputs.candidate_commit }}

      - name: Restore the downloadable assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: asset-*
          path: ${{ runner.temp }}/assets
          merge-multiple: true

      - name: Describe the complete downloadable asset set
        run: >-
          cargo xtask assets manifest
          --input "${{ runner.temp }}/assets"
          --output "${{ runner.temp }}/asset-manifest-v2.json"

      - name: Preserve the downloadable asset manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asset-manifest
          path: ${{ runner.temp }}/asset-manifest-v2.json
          if-no-files-found: error
          retention-days: 1

  aggregate:
    needs:
      - check
      - package
      - asset-manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.check.outputs.candidate_commit }}

      - name: Restore every candidate component
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: ${{ runner.temp }}/release-input/packages

      - name: Restore the complete downloadable asset set and manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: asset-*
          path: ${{ runner.temp }}/release-input/assets

      - name: Aggregate and verify the release bundle
        run: >-
          cargo xtask release aggregate
          --input "${{ runner.temp }}/release-input"
          --output "${{ runner.temp }}/release-dist"

      - name: Preserve the verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release-dist
          if-no-files-found: error
          retention-days: 7

  publish:
    needs:
      - check
      - aggregate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write

    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.check.outputs.candidate_commit }}

      - name: Atomically publish the immutable candidate tag
        env:
          EXPECTED_TAG: ${{ inputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Keep the token unavailable to build/check steps and install a
          # credential helper only for the exact tag transaction.
          # shellcheck disable=SC2016
          git config credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
          trap 'git config --unset-all credential.helper || true' EXIT
          cargo xtask release tag --expected-tag "$EXPECTED_TAG" --write

      - name: Restore the verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release-bundle

      - name: Create the immutable tag and GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ inputs.tag }}
          commit: ${{ needs.check.outputs.candidate_commit }}
          bodyFile: ${{ runner.temp }}/release-bundle/release-notes.md
          artifacts: ${{ runner.temp }}/release-bundle/*
          artifactErrorsFailBuild: true
          allowUpdates: false
          replacesArtifacts: false
          immutableCreate: true
          makeLatest: true

  website-assets:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      actions: write
      contents: read

    steps:
      - name: Advance and verify the released version's website asset channel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run completion-database.yml --ref main --repo "$GITHUB_REPOSITORY"
          run_id=""
          for _ in $(seq 1 30)
          do
            run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow completion-database.yml \
              --event workflow_dispatch \
              --branch main \
              --limit 5 \
              --json databaseId,createdAt \
              --jq ".[] | select(.createdAt >= \"${started}\") | .databaseId" \
              | head -n 1)"
            if test -n "$run_id"
            then
              break
            fi
            sleep 2
          done
          test -n "$run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

  homebrew:
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/homebrew.yml
    with:
      tag: ${{ inputs.tag }}
