name: Prepare release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out Quirl
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Show the release plan
        run: cargo xtask release plan

      - name: Prepare the release sources
        run: cargo xtask release prepare --write

      - name: Set up the documentation toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install the locked website dependencies
        run: npm ci --prefix website

      - name: Refresh generated website documentation
        # Compiled references include the workspace version; source mirrors alone
        # cannot refresh them after release preparation changes Cargo.toml.
        run: |
          npm --prefix website run sync:docs
          npm --prefix website run sync:reference

      - name: Install Linux reference shells
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh

      - name: Run the canonical quality gate
        # Match CI's bounded concurrency for process and terminal deadlines.
        env:
          RUST_TEST_THREADS: "2"
        run: cargo xtask check

      - name: Check the generated website and production build
        run: cargo xtask website-check

      - name: Open the release preparation pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          add-paths: |
            Cargo.toml
            Cargo.lock
            CHANGELOG.md
            RELEASE_NOTES.md
            website/content/docs/project/changelog.mdx
            website/content/docs/reference/cli-command-catalog.mdx
            website/content/docs/extensions/lua-api-reference.mdx
          branch: codex/release-prepare
          delete-branch: true
          commit-message: "chore(release): prepare next version"
          title: "chore(release): prepare next version"
          body: Generated by Quirl's bounded Rust release preparation command and verified with the canonical quality gate and website check.
