name: Prepare release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release-preparation
    permissions:
      contents: read

    steps:
      - name: Check out Quirl
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Show the release plan
        run: cargo xtask release plan

      - name: Prepare the release sources
        run: cargo xtask release prepare --write

      - name: Run the canonical quality gate
        run: cargo xtask check

      - name: Create a narrowly scoped release-preparation token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: niklas-heer
          repositories: quirl
          permission-contents: write
          permission-pull-requests: write

      - name: Open the release preparation pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.release-token.outputs.token }}
          add-paths: |
            Cargo.toml
            Cargo.lock
            CHANGELOG.md
            RELEASE_NOTES.md
          branch: codex/release-prepare
          delete-branch: true
          commit-message: "chore(release): prepare next version"
          title: "chore(release): prepare next version"
          body: Generated by Quirl's bounded Rust release preparation command and verified with the canonical quality gate.
