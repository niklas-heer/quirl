name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Check out Quirl
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Linux reference shells
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh

      - name: Verify both reference shells
        run: |
          bash --version
          zsh --version

      - name: Run the canonical quality gate
        # This suite spawns many real subprocesses/PTYs with wall-clock
        # deadlines (job control, terminal I/O). Running them at full
        # default parallelism has intermittently missed those deadlines
        # under this runner's CPU contention, not from any actual defect;
        # capping parallelism trades a little wall time for reliability.
        env:
          RUST_TEST_THREADS: "2"
        run: cargo xtask check
